name: Compila INOUT APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Prepara file INOUT.apk
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/INOUT.apk
      - name: Crea Release con Download Diretto
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "Release INOUT"
          files: output/INOUT.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pubblica Artefatto
        uses: actions/upload-artifact@v4
        with:
          name: INOUT-apk
          path: output/INOUT.apk